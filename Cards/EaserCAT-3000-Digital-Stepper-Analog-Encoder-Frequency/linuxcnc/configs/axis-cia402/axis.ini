# EaserCAT 3000 CiA402: three stepper axes (X, Y, Z) on the board's axes 1..3,
# with linuxcnc-ethercat (lcec), the IgH kernel master and the cia402
# component. The AXIS GUI, millimetres. See README.md.

[EMC]
VERSION = 1.1
MACHINE = EaserCAT-3000-CiA402
DEBUG = 0

[DISPLAY]
DISPLAY = axis
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.2
MAX_SPINDLE_OVERRIDE = 1.0
PROGRAM_PREFIX = ~/linuxcnc/nc_files
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 2
INCREMENTS = 10 mm, 1 mm, 0.1 mm, 0.01 mm
DEFAULT_LINEAR_VELOCITY = 10
MAX_LINEAR_VELOCITY = 50

[FILTER]
PROGRAM_EXTENSION = .py Python Script
py = python3

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[RS274NGC]
PARAMETER_FILE = linuxcnc.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
# The servo period is the EtherCAT cycle: it must equal appTimePeriod in
# ethercat-conf.xml. 1 ms is what the board has been tried with.
SERVO_PERIOD = 1000000

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[HAL]
HALFILE = e3000.hal
HALUI = halui

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 10
MAX_LINEAR_VELOCITY = 50
DEFAULT_LINEAR_ACCELERATION = 200
MAX_LINEAR_ACCELERATION = 500
POSITION_FILE = position.txt

[KINS]
KINEMATICS = trivkins
JOINTS = 3

[AXIS_X]
MAX_VELOCITY = 50
MAX_ACCELERATION = 500
MIN_LIMIT = -250
MAX_LIMIT = 250

[AXIS_Y]
MAX_VELOCITY = 50
MAX_ACCELERATION = 500
MIN_LIMIT = -250
MAX_LIMIT = 250

[AXIS_Z]
MAX_VELOCITY = 25
MAX_ACCELERATION = 250
MIN_LIMIT = -50
MAX_LIMIT = 100

# SCALE: steps per mm (cia402.<axis>.pos-scale). With 200 steps per turn,
# 1/8 microstepping and a 5 mm lead: 200 * 8 / 5 = 320. A negative scale
# turns the axis round (or use the polarity 0x607E, see ethercat-conf.xml).
# The board's step rate limits the speed: MAX_VELOCITY * SCALE must stay
# below 1 / (step length + step space) (0x2010..0x2013) and below what the
# drives take: 50 mm/s * 320 = 16000 steps/s.
#
# Homing is done by the board (CiA402 homing mode, ethercat-conf.xml): LinuxCNC
# starts it as "home on index" (HOME_USE_INDEX, index-enable -> cia402.N.home)
# and the edge of the home switch becomes the joint's HOME_OFFSET. The speeds are
# the board's (0x6099), HOME_LATCH_VEL only needs to be non-zero. With the
# board's default method 37 the joint is homed where it stands; methods 19..22
# use the home switches (IN1 = X, IN2 = Y, IN3 = Z by default).

[JOINT_0]
TYPE = LINEAR
SCALE = 320
HOME = 0.0
MAX_VELOCITY = 50
MAX_ACCELERATION = 500
MIN_LIMIT = -250
MAX_LIMIT = 250
FERROR = 1.0
MIN_FERROR = 0.25
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 1
HOME_USE_INDEX = YES
HOME_SEQUENCE = 1

[JOINT_1]
TYPE = LINEAR
SCALE = 320
HOME = 0.0
MAX_VELOCITY = 50
MAX_ACCELERATION = 500
MIN_LIMIT = -250
MAX_LIMIT = 250
FERROR = 1.0
MIN_FERROR = 0.25
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 1
HOME_USE_INDEX = YES
HOME_SEQUENCE = 1

[JOINT_2]
TYPE = LINEAR
SCALE = 320
HOME = 0.0
MAX_VELOCITY = 25
MAX_ACCELERATION = 250
MIN_LIMIT = -50
MAX_LIMIT = 100
FERROR = 1.0
MIN_FERROR = 0.25
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 1
HOME_USE_INDEX = YES
HOME_SEQUENCE = 0
