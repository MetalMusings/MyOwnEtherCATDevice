; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32F407VGT6]
framework = arduino
platform = ststm32
; STM32duino core 2.x. Core 3.0 (framework 4.30000+) has an incompatible API
platform_packages =
	platformio/framework-arduinoststm32@4.21200.0
	platformio/framework-cmsis-dsp
board = genericSTM32F407VGT6
; Flash only the board whose MCU UID matches (unique per chip), see tools/select_stlink.py.
; Other board: run "pio run -t upload" (or "pio run -t boards"), copy its UID from the
; output to custom_mcu_uid. Empty = use the ST-Link if exactly one is connected.
; Override once: MCU_UID=<uid> pio run -t upload
custom_mcu_uid = 003400165646501220313936
extra_scripts = post:tools/select_stlink.py
upload_protocol = stlink
debug_tool = stlink
debug_build_flags = -O0 -g -ggdb
monitor_port = COM10
monitor_filters = send_on_enter, time, colorize, log2file
monitor_speed = 115200
build_flags = -Wl,--no-warn-rwx-segment -Ilib/soes/include/sys/gcc -DAX58100
lib_deps = 
	SPI
	rlogiacco/CircularBuffer
